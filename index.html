<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lluvia de TE AMO</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
    }

    /* Contenedor del botón de inicio */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    /* Botón circular brillante */
    .start-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid #ff4d6d;
      background: radial-gradient(circle, #ff1a66 0%, #a70032 100%);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #ff4d6d, inset 0 0 10px #ffffff;
      outline: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 35px #ff1a66, inset 0 0 15px #ffffff;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    /* Texto flotante al hacer clic */
    .floating-text {
      position: absolute;
      color: #ff3366;
      font-size: 22px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 1.5s ease-out forwards;
      text-shadow: 0 0 5px white;
      z-index: 5;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.5);
      }
    }
  </style>
</head>
<body>

  <!-- Pantalla con botón de inicio -->
  <div id="start-screen">
    <button class="start-btn" id="start-btn">Iniciar ❤️</button>
  </div>

  <!-- Audio de GitHub -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://raw.githubusercontent.com/EndersonSivira/Lluvia-de-Te-Amo/main/Good%20Kid%20-%20From%20The%20Start%20(Laufey%20Cover)(M4A_128K).m4a" type="audio/mp4">
  </audio>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const music = document.getElementById('bg-music');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // Cargar la imagen desde el servidor Raw correcto de GitHub
    const bgImage = new Image();
    bgImage.crossOrigin = "anonymous"; // Evita bloqueos de seguridad del navegador
    bgImage.src = 'https://raw.githubusercontent.com/EndersonSivira/Lluvia-de-Te-Amo/main/IMG-20260923-WA0078.jpg';

    const phrase = "TE AMO ";
    const fontSize = 18;
    let columns = Math.floor(width / fontSize);
    let drops = Array(columns).fill(1);
    let isRunning = false;

    function draw() {
      if (!isRunning) return;

      // 1. Dibujar la imagen ajustada a la pantalla completa
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, width, height);
      } else {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, width, height);
      }

      // 2. Capa de sombra ligera (0.45) para que la foto no sea opaca y las letras resalten
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)"; 
      ctx.fillRect(0, 0, width, height);

      // 3. Dibujar las letras en degradado rosa/rojo
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "#ff4d6d");
      gradient.addColorStop(0.5, "#ff99aa");
      gradient.addColorStop(1, "#ff1a66");

      ctx.fillStyle = gradient;
      ctx.font = fontSize + "px 'Segoe UI', Arial";

      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(phrase, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }

      requestAnimationFrame(draw);
    }

    // Evento al pulsar el botón
    startBtn.addEventListener('click', () => {
      // Reproducir música
      music.play().catch(e => console.log("Error de audio:", e));

      // Ocultar botón
      startScreen.style.opacity = '0';
      startScreen.style.visibility = 'hidden';

      // Iniciar animación
      isRunning = true;
      draw();
    });

    // Redimensionar canvas
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      columns = Math.floor(width / fontSize);
      drops = Array(columns).fill(1);
    });

    // Clic en pantalla para flotante
    document.addEventListener('click', (e) => {
      if (!isRunning) return;

      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = 'TE AMO';
      text.style.left = e.clientX + 'px';
      text.style.top = e.clientY + 'px';
      document.body.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 1500);
    });
  </script>
</body>
</html>
